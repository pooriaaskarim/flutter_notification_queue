name: flutter_notification_queue
description: "A highly customizable, high-performance, and contextless overlay-based in-app notification queue system for Flutter."
version: 0.2.0
repository: https://github.com/pooriaaskarim/flutter_notification_queue
topics: [ flutter, notification, overlay, toast, popup ]
license: BSD-3-Clause

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  logd: ^0.8.6
  meta: '>=1.9.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.3
  logd_linters: ^0.1.1


flutter:
  uses-material-design: true
